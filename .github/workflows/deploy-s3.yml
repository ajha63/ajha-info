name: Deploy website to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::554982632606:role/GitHubActions-ajha-info
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://ajha.info \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"